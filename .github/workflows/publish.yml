name: publish

# Per-package tags, so each package releases when it has something worth
# releasing:
#
#   validate-v0.1.0  ->  @daichodo/validate
#   client-v0.1.0    ->  daichodo
#
# An earlier version published every workspace on a bare `v*` tag. That is
# wrong here: the validator is useful today, while the client targets an API
# that is not deployed yet. Publishing them together would put a client on the
# registry that cannot work, and npm versions cannot be reused.

on:
  push:
    tags:
      - 'validate-v*'
      - 'client-v*'

permissions:
  contents: read
  id-token: write   # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Work out what is being released
        id: target
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            validate-v*) DIR=packages/validate; VERSION="${TAG#validate-v}" ;;
            client-v*)   DIR=packages/daichodo; VERSION="${TAG#client-v}" ;;
            *) echo "::error::unrecognised tag $TAG"; exit 1 ;;
          esac
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $DIR at $VERSION"

      - run: npm ci

      - name: Take the version from the tag
        # The tag is the single source of truth. Manifests hold a placeholder
        # and are never hand-bumped: forgetting is the most common release
        # failure, and it surfaces as a duplicate-version rejection after build
        # and tests have already passed. A tag can only exist once.
        working-directory: ${{ steps.target.outputs.dir }}
        run: npm version "${{ steps.target.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build and test everything
        # Both packages, not just the one being published: the validator and the
        # client share the check-digit vectors, and a release should not proceed
        # if the other half is broken.
        run: |
          npm run --workspaces --if-present build
          npm run --workspaces --if-present test

      - name: Publish
        # Provenance ties the tarball to the workflow run and commit that built
        # it, which makes "this is generated from the schema" verifiable rather
        # than merely claimed.
        working-directory: ${{ steps.target.outputs.dir }}
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
